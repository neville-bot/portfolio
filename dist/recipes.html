<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://kit.fontawesome.com/808fc3951d.js"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./favicon.ico/favicon-32x32.png?"
    />
    <link rel="stylesheet" href="css/main.css" />
    <title>My Recipes</title>
  </head>
  <body class="recipes-page">
    <header class="recipes-top">
      <a href="/" class="back-link">John Nevin</a>
      <span class="top-mono">Recipes ›</span>
    </header>
    <main id="recipes">
      <h1 class="lg-heading">My <span class="text-secondary">Recipes</span></h1>
      <h2 class="sm-heading">Pick something to cook...</h2>
      <select class="recipe-select" id="recipe-select" aria-label="Select a recipe">
        <option value="">-- Choose a recipe --</option>
      </select>
      <div class="recipe-display" id="recipe-display"></div>
    </main>
    <button id="sticky-ingredients-bar" type="button" aria-controls="ingredients-overlay">
      Ingredients
    </button>
    <div id="ingredients-overlay" role="dialog" aria-modal="true" aria-label="Ingredients">
      <div class="ingredients-overlay-inner"></div>
    </div>
    <script src="js/main.js"></script>
    <script src="js/recipes.js"></script>
    <script>
      init({
        select: document.getElementById('recipe-select'),
        display: document.getElementById('recipe-display'),
        stickyBar: document.getElementById('sticky-ingredients-bar'),
        overlay: document.getElementById('ingredients-overlay'),
        fetchJson: url => fetch(url).then(r => r.ok ? r.json() : Promise.reject()),
      });
    </script>
  </body>
</html>
